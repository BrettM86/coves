version: "2"

linters:
  default: none
  enable:
    - govet          # Examine Go source code and report suspicious constructs
    - errcheck       # Check for unchecked errors
    - staticcheck    # Advanced static analysis
    - unused         # Check for unused code
    - ineffassign    # Detect ineffectual assignments
  settings:
    errcheck:
      check-blank: false  # Don't check blank assignments (allows _ = in defer closures)
      # Errors these return carry no signal at the call site: rows.Err()
      # reports iteration failures, Rollback after Commit returns ErrTxDone,
      # and closing a read response body cannot lose data.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (io.ReadCloser).Close
    govet:
      enable-all: true
      disable:
        - shadow          # Disable shadow checking (common pattern in tests)
        - fieldalignment  # Byte-packing order, not correctness; reorders fields away from readable grouping
    staticcheck:
      # staticcheck's own default set: everything except the stylistic checks
      # it disables upstream (package comments, initialisms, comment forms).
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

formatters:
  enable:
    - gofmt          # Enforce standard Go formatting
    - gofumpt        # Stricter gofmt (extra formatting rules)
    - goimports      # Check import organization
  settings:
    gofmt:
      simplify: true   # Simplify code where possible
    gofumpt:
      module-path: Coves  # dotless module path; see goimports below
      extra:
        group-params: true
    goimports:
      # The module path has no dot, so without this goimports files Coves/...
      # imports with the standard library.
      local-prefixes:
        - Coves

run:
  timeout: 5m
  # Most of the suite is behind these tags; without them it is never linted.
  build-tags:
    - integration
    - e2e
    - live
  tests: true
  go: "1.26"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
