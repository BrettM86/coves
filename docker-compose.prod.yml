# Coves Production Stack
#
# Architecture:
#   - coves.social: AppView domain (API, frontend, .well-known/did.json)
#   - pds.coves.me: PDS domain (canonical hostname for relay registration)
#   - coves.me: PDS domain (legacy, kept for compatibility)
#
# Hardware: AMD Epyc 7351p (16c/32t), 256GB RAM, 2x500GB NVMe RAID
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. DNS configured for both domains
#   2. SSL certificates (Caddy handles this automatically)
#   3. .env.prod file with secrets
#   4. .well-known/did.json deployed to coves.social

services:
  # PostgreSQL Database for AppView
  postgres:
    # Pinned by digest: `docker compose pull` must never silently change what
    # runs in prod. Bump tag + digest together in a reviewed commit
    # (`docker buildx imagetools inspect postgres:<tag>` resolves the digest).
    #
    # WARNING: changing this line (or pds's) makes the NEXT `up -d` of any
    # service that depends_on it (caddy, appview) recreate this container too,
    # unless that `up -d` passes --no-deps. Plan a DB restart window when you
    # bump it. This digest is 15.19, running in prod since 2026-08-26.
    image: postgres:15@sha256:926f8799aef36e00001cfe15fba7abbd37d3c5224ea57e4c858e4bb670f10561
    container_name: coves-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount backup directory for pg_dump
      - ./backups:/backups
    networks:
      - coves-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Generous limits for 256GB server
    deploy:
      resources:
        limits:
          memory: 32G
        reservations:
          memory: 4G

  # Coves AppView (Go Server)
  appview:
    build:
      context: .
      dockerfile: Dockerfile
    # VERSION defaults to the git short SHA in scripts/deploy.sh so the image
    # tag on the box says exactly which commit is running.
    image: coves/appview:${VERSION:-latest}
    container_name: coves-prod-appview
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"  # Only expose to localhost (Caddy proxies)
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

      # Instance identity
      INSTANCE_DID: did:web:coves.social
      INSTANCE_DOMAIN: coves.social
      APPVIEW_PUBLIC_URL: https://coves.social

      # PDS connection (separate domain!)
      PDS_URL: https://coves.me

      # Jetstream feeds: every consumer runs once per feed; per-consumer
      # collection filters are derived in code (jetstream.WantedCollections).
      #   bsky = Bluesky's public Jetstream (third-party PDS records + redundancy;
      #          keeps the legacy consumer names so live cursors carry over)
      #   self = self-hosted relay+Jetstream pair (tidepool stack, deployed
      #          2026-07-17) on this same network, crawling tdpl.io +
      #          pds.coves.me with no bsky.network account quotas. Addressed
      #          by CONTAINER name on port 8080 — the tidepool stack's bare
      #          `jetstream` service alias is the same cross-stack trap as
      #          the `postgres` alias, and 6008 is the local dev port.
      # Rev-gating (migration 033) makes the cross-feed overlap safe; expect
      # "rev-gate: skipped stale" log lines for the lagging bsky copies.
      JETSTREAM_FEEDS: "bsky=wss://jetstream2.us-east.bsky.network;self=ws://tidepool-prod-jetstream:8080"

      # Security - MUST be false in production
      AUTH_SKIP_VERIFY: "false"
      SKIP_DID_WEB_VERIFICATION: "false"

      # OAuth (for community account provisioning)
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      OAUTH_SEAL_SECRET: ${OAUTH_SEAL_SECRET}

      # OAuth Confidential Client (optional - enables 1-year sessions instead of 14-day)
      # Generate keys with: go run ./cmd/tools/generate-oauth-key
      OAUTH_CLIENT_PRIVATE_KEY: ${OAUTH_CLIENT_PRIVATE_KEY:-}
      OAUTH_CLIENT_KEY_ID: ${OAUTH_CLIENT_KEY_ID:-}

      # Application settings
      PORT: 8080
      ENV: production
      LOG_LEVEL: info

      # Encryption key for community credentials
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Cursor encryption for pagination
      CURSOR_SECRET: ${CURSOR_SECRET}

      # PDS JWT secret for verifying HS256 tokens from the PDS
      # Must match the PDS_JWT_SECRET configured on the PDS
      PDS_JWT_SECRET: ${PDS_JWT_SECRET}
      # Whitelist PDS issuer(s) allowed to use HS256 (no kid)
      HS256_ISSUERS: ${HS256_ISSUERS}

      # Restrict community creation to instance DID only
      COMMUNITY_CREATORS: did:web:coves.social

      # Trusted aggregators (bypass per-community authorization check)
      # Comma-separated list of DIDs
      TRUSTED_AGGREGATOR_DIDS: ${TRUSTED_AGGREGATOR_DIDS:-}

      # Trusted virtual bridge PDS hosts. Required for Tidepool-authored
      # profiles/posts to be indexed and for bridge-asserted bridgedStats to
      # be accepted. Example: https://tdpl.io
      TRUSTED_BRIDGE_PDS_HOSTS: ${TRUSTED_BRIDGE_PDS_HOSTS:-}

      # Bridged-vote poller tuning (active only when TRUSTED_BRIDGE_PDS_HOSTS is
      # set). Passed through explicitly: a variable only present in .env is
      # invisible to the container, so setting it there without these lines
      # silently has no effect.
      BRIDGED_VOTE_POLL_INTERVAL: ${BRIDGED_VOTE_POLL_INTERVAL:-}
      BRIDGED_VOTE_POLL_LOOKBACK: ${BRIDGED_VOTE_POLL_LOOKBACK:-}
      BRIDGED_VOTE_POLL_SWEEP_CAP: ${BRIDGED_VOTE_POLL_SWEEP_CAP:-}

      # Image proxy configuration (on-the-fly resizing with disk cache).
      # The base URL is the hostname every Coves image URL is built from; it is
      # the media hostname, not the AppView apex, because only that hostname is
      # CDN-proxied for scanning. See docs/PRD_CSAM_SCANNING.md.
      IMAGE_PROXY_ENABLED: ${IMAGE_PROXY_ENABLED:-true}
      IMAGE_PROXY_BASE_URL: ${IMAGE_PROXY_BASE_URL:-https://img.coves.social}
      # Optional override that wins over the base URL. Passed through explicitly:
      # a variable only present in .env is invisible to the container, so setting
      # it there without this line silently has no effect.
      IMAGE_PROXY_CDN_URL: ${IMAGE_PROXY_CDN_URL:-}
      IMAGE_PROXY_CACHE_PATH: /var/cache/coves/images
      IMAGE_PROXY_CACHE_MAX_GB: ${IMAGE_PROXY_CACHE_MAX_GB:-10}
      IMAGE_PROXY_FETCH_TIMEOUT_SECONDS: ${IMAGE_PROXY_FETCH_TIMEOUT_SECONDS:-30}
      IMAGE_PROXY_MAX_SOURCE_SIZE_MB: ${IMAGE_PROXY_MAX_SOURCE_SIZE_MB:-10}
      # Decode-cost bounds (SECURITY_AUDIT_2026-09-01 §1.1): a source image's
      # declared pixel count is refused above the megapixel budget before any
      # decode allocation; decodes run in a fixed number of slots; cold requests
      # (each holding a fetched blob of up to MAX_SOURCE_SIZE_MB) are admitted
      # up to the in-flight cap. All three must be passed through here, the
      # container sees no env_file.
      IMAGE_PROXY_MAX_SOURCE_MEGAPIXELS: ${IMAGE_PROXY_MAX_SOURCE_MEGAPIXELS:-50}
      IMAGE_PROXY_MAX_CONCURRENT_PROCESSES: ${IMAGE_PROXY_MAX_CONCURRENT_PROCESSES:-4}
      IMAGE_PROXY_MAX_IN_FLIGHT_REQUESTS: ${IMAGE_PROXY_MAX_IN_FLIGHT_REQUESTS:-64}
      # Acknowledges serving media straight from PDS blob endpoints. Only
      # consulted when IMAGE_PROXY_ENABLED=false, where it is required for the
      # server to start.
      ALLOW_UNPROXIED_MEDIA: ${ALLOW_UNPROXIED_MEDIA:-false}

      # OpenTelemetry Observability (optional - disabled by default)
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-coves-appview}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-false}

      # Bot-protected signup (Cloudflare Turnstile + on-the-fly PDS invite codes)
      # TURNSTILE_SITE_KEY is the PUBLIC Cloudflare key embedded into the
      # /m/turnstile.html page the mobile WebView loads.
      # TURNSTILE_SECRET_KEY is the server-side Cloudflare secret.
      # PDS_ADMIN_PASSWORD is already defined for the PDS block below — same value,
      # also consumed by AppView to mint single-use invite codes.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD}

      # Telegram operator alerts for user-filed admin reports (optional).
      # Off by default: reports are stored either way, but with alerting off
      # nothing tells anyone a report exists — a CSAM report then sits in
      # admin_reports unread. Enabling with an incomplete config FAILS STARTUP
      # rather than degrading to silence.
      # TELEGRAM_ALERT_REASONS is a comma-separated subset of
      # csam,doxing,harassment,spam,illegal,other; empty alerts on all of them.
      TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ALERT_REASONS: ${TELEGRAM_ALERT_REASONS:-}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-5}
    volumes:
      # Image proxy cache (persistent across container restarts)
      - imageproxy-cache:/var/cache/coves/images
    networks:
      - coves-internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/xrpc/_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Go is memory-efficient, but give it room for connection pools
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 512M

  # Bluesky PDS (Personal Data Server)
  # Handles community accounts and their repositories
  pds:
    # Pinned by tag + digest — the PDS holds community repo signing keys, so
    # upgrades are an explicit reviewed commit, never an implicit pull.
    # Bump: `docker buildx imagetools inspect ghcr.io/bluesky-social/pds:<tag>`.
    # Same depends_on caveat as postgres above: a changed pin is applied by
    # the next `up -d caddy` unless --no-deps is used.
    image: ghcr.io/bluesky-social/pds:0.4.5027@sha256:d95725b24dbe53af9d91dc69750556931ebed6c396f2cfa42b221434db642f12
    container_name: coves-prod-pds
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"  # Only expose to localhost (Caddy proxies)
    environment:
      # PDS identity (use pds.coves.me for fresh relay registration)
      PDS_HOSTNAME: pds.coves.me
      PDS_PORT: 3000
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOB_UPLOAD_LIMIT: 104857600  # 100 MB

      # S3-compatible blob storage
      PDS_BLOBSTORE_S3_BUCKET: ${PDS_S3_BUCKET}
      PDS_BLOBSTORE_S3_REGION: ${PDS_S3_REGION}
      PDS_BLOBSTORE_S3_ENDPOINT: ${PDS_S3_ENDPOINT}
      PDS_BLOBSTORE_S3_ACCESS_KEY_ID: ${PDS_S3_ACCESS_KEY_ID}
      PDS_BLOBSTORE_S3_SECRET_ACCESS_KEY: ${PDS_S3_SECRET_ACCESS_KEY}
      PDS_BLOBSTORE_S3_FORCE_PATH_STYLE: "true"

      # PLC Directory (production)
      PDS_DID_PLC_URL: https://plc.directory

      # Handle domains
      # Community handles use @community.coves.social (AppView domain)
      # Note: Root domain (coves.social) handle works via .well-known resolution
      PDS_SERVICE_HANDLE_DOMAINS: .coves.social

      # Security (set real values in .env.prod)
      PDS_JWT_SECRET: ${PDS_JWT_SECRET}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_ROTATION_KEY}

      # Email (optional, for account recovery)
      # NOTE: Must set BOTH or NEITHER - PDS fails with partial config
      # PDS_EMAIL_SMTP_URL: ${PDS_EMAIL_SMTP_URL}
      # PDS_EMAIL_FROM_ADDRESS: ${PDS_EMAIL_FROM_ADDRESS}

      # Production mode
      PDS_DEV_MODE: "false"
      PDS_INVITE_REQUIRED: "true"

      # Logging
      NODE_ENV: production
      LOG_ENABLED: "true"
      LOG_LEVEL: info

      # AppView proxy (for app.bsky.* methods like getProfile, notifications, etc.)
      PDS_BSKY_APP_VIEW_URL: https://api.bsky.app
      PDS_BSKY_APP_VIEW_DID: did:web:api.bsky.app

      # Report service (for reporting content)
      PDS_REPORT_SERVICE_URL: https://mod.bsky.app
      PDS_REPORT_SERVICE_DID: did:plc:ar7c4by46qjdydhdevvrndac

      # Relay crawlers (for federation with Bluesky network)
      PDS_CRAWLERS: https://bsky.network,https://relay1.us-east.bsky.network,https://relay1.us-west.bsky.network,https://relay.fire.hose.cam,https://relay.upcloud.world
    volumes:
      - pds-data:/pds
    networks:
      - coves-internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/xrpc/_health"]
      interval: 30s
      timeout: 5s
      retries: 5
    # PDS (Node.js) needs memory for blob handling
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 1G

  # Caddy Reverse Proxy
  # Handles HTTPS automatically via Let's Encrypt
  # Uses Cloudflare plugin for wildcard SSL certificates (*.coves.social)
  caddy:
    # Built locally from the official caddy image + caddy-dns/cloudflare, both
    # pinned (see docker/caddy/Dockerfile). Never a floating third-party tag:
    # this container holds the Cloudflare tokens and terminates all TLS.
    # Upgrade = bump the Dockerfile pins, then `build caddy` + `up -d caddy`.
    build:
      context: ./docker/caddy
      dockerfile: Dockerfile
    image: coves/caddy:${CADDY_VERSION:-2.11.4}
    container_name: coves-prod-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Required for wildcard SSL via DNS challenge
      # Create at: Cloudflare Dashboard → My Profile → API Tokens → Create Token
      # Permissions: Zone:DNS:Edit for coves.social zone
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      # Separate token for the tdpl.io zone (Tidepool bridged-instance
      # wildcards, e.g. *.lemmy-world.tdpl.io). Same Zone:DNS:Edit
      # permission, scoped to tdpl.io ONLY — split from the coves.social
      # token so either can be rotated/revoked without touching the other.
      CLOUDFLARE_API_TOKEN_TDPL: ${CLOUDFLARE_API_TOKEN_TDPL}
      # ACME account email, substituted into the Caddyfile's {$ACME_EMAIL}
      # at parse time. Use a role address (e.g. support@coves.social) —
      # the Caddyfile is committed to a public repo, the env file is not.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # Static files (.well-known DID docs, images)
      - ./static:/srv:ro
    networks:
      - coves-internal
    depends_on:
      - appview
      - pds

networks:
  coves-internal:
    driver: bridge
    name: coves-prod-network

volumes:
  postgres-data:
    name: coves-prod-postgres-data
  pds-data:
    name: coves-prod-pds-data
  caddy-data:
    name: coves-prod-caddy-data
  caddy-config:
    name: coves-prod-caddy-config
  imageproxy-cache:
    name: coves-prod-imageproxy-cache
