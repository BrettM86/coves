<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <title>Verify</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .widget {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        #error {
            display: none;
            max-width: 320px;
            padding: 12px 16px;
            color: #b00020;
            font-size: 14px;
            line-height: 1.4;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="widget">
        <div class="cf-turnstile"
             data-sitekey="{{.SiteKey}}"
             data-callback="onTurnstileSuccess"
             data-theme="auto"
             data-size="flexible"
             data-retry="auto"
             data-refresh-expired="auto"></div>
    </div>
    <div id="error" role="alert"></div>
    <script>
        (function () {
            function showError(msg) {
                var el = document.getElementById("error");
                var widget = document.querySelector(".widget");
                if (el) {
                    el.textContent = msg;
                    el.style.display = "block";
                }
                if (widget) {
                    widget.style.display = "none";
                }
            }
            function postToken(token) {
                // Channel missing (dev/browser context) is expected — stay silent.
                // Channel present but throwing means the captcha succeeded but the
                // bridge broke; the user must be told so they don't sit on a stuck screen.
                var hasChannel = window.Turnstile && typeof window.Turnstile.postMessage === "function";
                if (!hasChannel) {
                    return;
                }
                try {
                    window.Turnstile.postMessage(token);
                } catch (e) {
                    showError("Verification succeeded but couldn't be sent. Please reload and try again.");
                }
            }
            window.onTurnstileSuccess = function (token) {
                postToken(token);
            };
        })();
    </script>
</body>
</html>
