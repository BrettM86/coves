services:
  kagi-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kagi-news-aggregator
    restart: unless-stopped

    # Environment variables - override in .env file or here
    environment:
      # Required COVES_API_KEY and ANTHROPIC_API_KEY come from .env (env_file below)

      # Optional: Override Coves API URL
      - COVES_API_URL=${COVES_API_URL:-https://api.coves.social}

      # Optional: Run immediately on startup (useful for testing)
      - RUN_ON_STARTUP=${RUN_ON_STARTUP:-false}

    # Mount config file if you want to modify it without rebuilding
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data  # State persistence (data/state.json)

    # Load COVES_API_KEY, ANTHROPIC_API_KEY and overrides from .env
    env_file:
      - .env

    # journald keeps logs across recreates; json-file logs are deleted with
    # the container. `docker logs` shows only the current container; for
    # history use `journalctl CONTAINER_NAME=<name>`.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: Networks for multi-container setups
# networks:
#   coves:
#     external: true
